<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>우리 반 마을 꾸미기</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 상단 헤더: 로고, 현재 학생 이름, 메뉴 버튼 등 -->
    <header id="app-header">
      <h1 id="app-title">우리 반 마을</h1>
      <nav id="app-nav">
        <button id="btn-my-room" type="button">내 방 꾸미기</button>
        <button id="btn-explore" type="button">마을 탐험하기</button>
      </nav>
    </header>

    <!-- 메인 게임 화면: 마을/방 렌더링 영역 -->
    <main id="game-container">
      <div id="game-stage">
        <!-- 이후 이 안에 마을 맵, 학생 방, 캐릭터, 아이템 등을 렌더링합니다. -->
      </div>
    </main>

    <!-- 하단/사이드 패널: 아이템 선택, 인벤토리 등 (추후 구현) -->
    <aside id="side-panel">
      <div id="item-palette">
        <!-- 아이템 목록이 들어갈 자리 -->
      </div>
    </aside>

    <footer id="app-footer">
      <p>&copy; 2026 우리 반 마을 꾸미기</p>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
